name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run smoke:server-adapter

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: branchpilot
          POSTGRES_PASSWORD: branchpilot
          POSTGRES_DB: branchpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U branchpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://branchpilot:branchpilot@localhost:5432/branchpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: branchpilot
          POSTGRES_PASSWORD: branchpilot
          POSTGRES_DB: branchpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U branchpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://branchpilot:branchpilot@localhost:5432/branchpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

# Added in Phase 5, once the underlying tooling exists (see IMPLEMENTATION_GUIDE.md
# step 13): OpenAPI drift check (`openapi:generate` + `git diff --exit-code`), Docker
# image build, and dependency/image vulnerability scanning.
